[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flypoker"
version = "0.1.0"
description = "A table of fruit-fly brains that learn poker via dopamine, and die when they go broke"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jaylendilkhush2028" }]
keywords = ["poker", "multi-agent", "reinforcement-learning", "drosophila", "mushroom-body", "neuroscience"]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The real-connectome brain (scripts/run_connectome_table.py) also needs the
# FlyGambler package, which owns the connectome loader + spiking engine and pulls
# in brian2/scipy. It's a path/VCS install, so it's documented in the README
# rather than pinned here:  pip install -e /path/to/FlyGambler
connectome = ["scipy", "pandas", "pyarrow"]

[project.urls]
Homepage = "https://github.com/jaylendilkhush2028/flypoker"

[tool.setuptools]
packages = ["flypoker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
