[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flypoker"
version = "0.1.0"
description = "A table of fruit-fly brains that learn poker via dopamine, and die when they go broke"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jaylendilkhush2028" }]
keywords = ["poker", "multi-agent", "reinforcement-learning", "drosophila", "mushroom-body", "neuroscience"]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jaylendilkhush2028/flypoker"

[tool.setuptools]
packages = ["flypoker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
